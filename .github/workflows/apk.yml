name: Build Android APK

# Build a fully-offline installable APK from the static export.
# Run it from the Actions tab → "Build Android APK" → Run workflow,
# or automatically when a v* tag is pushed (creates a GitHub Release).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/attach the GitHub Release on v* tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The APK is a pure client SPA — server API routes are removed for the export.
      - name: Remove server API routes
        run: rm -rf src/app/api

      - name: Static export (out/)
        run: bun run build:apk

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Generate app icons & splash
        run: bunx @capacitor/assets generate --android --iconBackgroundColor '#ebf3ed' --splashBackgroundColor '#ebf3ed' --assetPath 'assets'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | head -1 | cut -d'"' -f2)
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-out/HesabYar-ReyRa-$VERSION.apk"
          echo "apk=apk-out/HesabYar-ReyRa-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "APK file: HesabYar-ReyRa-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-ReyRa-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk }}
